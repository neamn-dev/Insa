<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a new account to access the secure dashboard.">
  <title>Register — AuthGuard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="page-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo"></div>
        <h1>Create Account</h1>
        <p>Sign up to get started with AuthGuard</p>
      </div>

      <!-- Alert Banner -->
      <div id="alert" class="alert" role="alert">
        <span id="alert-icon"></span>
        <span id="alert-message"></span>
      </div>

      <form id="register-form" autocomplete="off">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-input" placeholder="neamn menkr" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
        </div>

        <div class="form-group" style="margin-bottom: 0.75rem;">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Create a strong password" required>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" class="form-input" placeholder="Re-enter your password" required>
          <div class="password-rules" id="password-rules">
            <div class="rule-item" id="rule-length">
              <span class="rule-icon">✓</span>
              <span>At least 8 characters</span>
            </div>
            <div class="rule-item" id="rule-letter">
              <span class="rule-icon">✓</span>
              <span>Contains a letter (a-z)</span>
            </div>
            <div class="rule-item" id="rule-number">
              <span class="rule-icon">✓</span>
              <span>Contains a number (0-9)</span>
            </div>
            <div class="rule-item" id="rule-match">
              <span class="rule-icon">✓</span>
              <span>Passwords match</span>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="register-btn">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    // Real-time password strength validation
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const ruleLength = document.getElementById('rule-length');
    const ruleLetter = document.getElementById('rule-letter');
    const ruleNumber = document.getElementById('rule-number');
    const ruleMatch = document.getElementById('rule-match');

    function checkRules() {
      const val = passwordInput.value;
      const confirmVal = confirmPasswordInput.value;
      ruleLength.classList.toggle('valid', val.length >= 8);
      ruleLetter.classList.toggle('valid', /[a-zA-Z]/.test(val));
      ruleNumber.classList.toggle('valid', /\d/.test(val));
      ruleMatch.classList.toggle('valid', val.length > 0 && val === confirmVal);
    }

    passwordInput.addEventListener('input', checkRules);
    confirmPasswordInput.addEventListener('input', checkRules);

    // Registration form submit
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('register-btn');
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      // Client-side validation
      if (password !== confirmPassword) return showAlert('danger', 'Passwords do not match.');
      if (password.length < 8) return showAlert('danger', 'Password must be at least 8 characters.');
      if (!/[a-zA-Z]/.test(password)) return showAlert('danger', 'Password must contain at least one letter.');
      if (!/\d/.test(password)) return showAlert('danger', 'Password must contain at least one number.');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Creating account...';

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();

        if (res.ok) {
          showAlert('success', data.message || 'Account created! Redirecting to login...');
          setTimeout(() => window.location.href = 'login.html', 1500);
        } else {
          showAlert('danger', data.message || 'Registration failed.');
        }
      } catch (err) {
        showAlert('danger', 'Network error. Please try again.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Create Account';
      }
    });
  </script>
</body>

</html>
