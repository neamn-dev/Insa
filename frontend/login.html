<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your AuthGuard account.">
  <title>Login — AuthGuard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">🛡️</div>
        <h1>Welcome Back</h1>
        <p>Sign in to your account</p>
      </div>

      <!-- Alert Banner -->
      <div id="alert" class="alert" role="alert">
        <span id="alert-icon"></span>
        <span id="alert-message"></span>
      </div>

      <form id="login-form" autocomplete="off">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary" id="login-btn">
          Sign In
        </button>
      </form>

      <div class="divider"><span>or</span></div>

      <!-- Google Sign-In Button — Full Page Redirect (NO POPUP) -->
      <a href="/api/google/redirect" class="btn btn-google" id="google-login-btn">
        <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign in with Google
      </a>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    // Check for Google OAuth redirect errors
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error')) {
      const errorMap = {
        'google_denied': 'Google Sign-In was cancelled.',
        'no_code': 'Google authorization failed. No code received.',
        'token_exchange_failed': 'Google token exchange failed. Check your Client ID/Secret.',
        'google_auth_failed': 'Google authentication error. Please try again.',
        'no_email': 'Could not retrieve email from Google account.'
      };
      showAlert('danger', errorMap[urlParams.get('error')] || 'Google Sign-In failed.');
      // Clean up URL
      history.replaceState({}, '', '/login.html');
    }

    // Login form submission
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) return showAlert('danger', 'Please fill in all fields.');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          sessionStorage.setItem('access_token', data.access_token);
          
          if (data.suspicious_login) {
            sessionStorage.setItem('suspicious_login', 'true');
            sessionStorage.setItem('previous_device', data.previous_device || 'Unknown');
          }
          
          showAlert('success', 'Login successful! Redirecting...');
          setTimeout(() => window.location.href = 'dashboard.html', 800);
        } else {
          showAlert('danger', data.message || 'Login failed.');
        }
      } catch (err) {
        showAlert('danger', 'Network error. Please try again.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
      }
    });
  </script>
</body>
</html>
